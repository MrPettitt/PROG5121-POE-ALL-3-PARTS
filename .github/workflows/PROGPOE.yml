# Compiles the project and runs the unit tests

name: TestPROGPOE

# Controls when the workflow will run
on:
  # Triggers the workflow on every push and on pull requests
  push:
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      
     # list contents or directory
      - name: List contents
        run: ls
     # Compiles classes to test 
      - name: compile classes
        working-directory: ./src
        run: javac -cp "../testresources/junit-platform-console-standalone-1.6.0.jar" ./st10090394/ST10090394.java ./st10090394/Message.java ./st10090394/Login.java ./st10090394/Task.java "../test/st10090394/ST10090394Test.java"  "../test/st10090394/MessageTest.java" "../test/st10090394/LoginTest.java" "../test/st10090394/TaskTest.java"  

    # list contents of src to verify that classess compiled 
      - name: List contents of src directory after compile
        working-directory: ./src/st10090394
        run: ls
        
        
       # copy compiled classes to test directory 
      - name : copy compiled classes to testresources directory 
        working-directory: ./src/st10090394
        run: cp -t  "../../test/st10090394" Login.class Message.class ST10090394.class Task.class
        
        #copy compiled tests 
      - name : copy compiled Test classes to testresources directory 
        working-directory: ./test/st10090394
        run: cp -t  "../../testresources/" LoginTest.class MessageTest.class ST10090394Test.class TaskTest.class
        
        # list contents or directory
      - name: List contents test package
        working-directory: ./test/st10090394
        run: ls
        
        #run Message Class tests and output report 
      - name: run Messages Class tests and create report 
        working-directory: ./test
        run: |
         ls
         java -jar  "../testresources/junit-platform-console-standalone-1.6.0.jar" -cp "." --select-class  st10090394.MessageTest

      - name: run Login Class tests and create report
        working-directory: ./test
        run: java -jar  "../testresources/junit-platform-console-standalone-1.6.0.jar" -cp "." --select-class  st10090394.LoginTest

      - name: run Task Class tests and create report
        working-directory: ./test
        run: java -jar  "../testresources/junit-platform-console-standalone-1.6.0.jar" -cp "." --select-class  st10090394.TaskTest
       
     
